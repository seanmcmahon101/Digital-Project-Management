name: Bug report
description: Report a reproducible problem with the application.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Remove confidential project information, personal data, and sensitive paths from anything you share.

  - type: input
    id: version
    attributes:
      label: Application version
      description: Find this under Settings → About.
      placeholder: e.g. 1.2.3
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Operating system version and processor
      placeholder: e.g. Windows 11, x86-64; macOS 15, Apple silicon
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain what you expected and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste only relevant app.log lines after removing sensitive data and paths.
      render: text

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots or other details if they help explain the issue.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed confidential project information and personal data.
          required: true
